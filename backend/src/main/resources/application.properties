spring.application.name=CourseCraftAI
server.port=${PORT:8080}

spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/coursecraft}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

app.security.jwt.enabled=${JWT_AUTH_ENABLED:false}
app.security.local-dev-user-id=${LOCAL_DEV_USER_ID:local-dev-user}
app.security.auth0.issuer-uri=${AUTH0_ISSUER_URI:}
app.security.auth0.audience=${AUTH0_AUDIENCE:}

app.ai.provider=${AI_PROVIDER:template}
app.ai.gemini.api-key=${GEMINI_API_KEY:}
app.ai.gemini.model=${GEMINI_MODEL:gemini-1.5-flash}
app.ai.gemini.tts-model=${GEMINI_TTS_MODEL:gemini-2.5-flash-preview-tts}
app.ai.gemini.tts-voice=${GEMINI_TTS_VOICE:Kore}
app.ai.openrouter.api-key=${OPENROUTER_API_KEY:}
app.ai.openrouter.model=${OPENROUTER_MODEL:openai/gpt-4o-mini}
app.ai.openrouter.base-url=${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
app.ai.openrouter.referer=${OPENROUTER_HTTP_REFERER:http://localhost:5173}
app.ai.openrouter.title=${OPENROUTER_APP_TITLE:CourseCraft AI}

app.youtube.api-key=${YOUTUBE_API_KEY:}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true

info.app.name=CourseCraft AI
info.app.description=AI-powered course generation platform
info.app.version=0.0.1
